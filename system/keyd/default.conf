# caps lock：单击 = esc；按住 = ctrl，但窗口键改发 ctrl+alt+super+键 给 niri
# 系统级配置，不走 install.sh：
#   sudo cp ~/dotfiles/system/keyd/default.conf /etc/keyd/ && sudo systemctl restart keyd   # 不要用 keyd reload，可能崩溃
# 在内核输入层生效，GNOME / niri / TTY 都适用
# 物理 Control 键不受影响，始终是普通 ctrl
[ids]
*

[main]
capslock = overload(wm, esc)
# fn 做成一层：keyd 独占键盘后它的虚拟键盘发不出 fn（KEY_FN=464，超出 keyd 的范围），
# Touch Bar（tiny-dfr）收不到 fn 就不会切换，所以 F1-F12 改由这里提供（见 docs/troubleshooting.md）
fn = layer(fn)

# 按住 caps 时默认就是 ctrl（Caps+C / Caps+R / Caps+W 等照常）
# 下面列出的键例外：改发 ctrl+alt+super+键，没有应用会用到这个组合，只给 niri
# 同时按住 shift 会原样带上，所以 Caps+Shift+键 也能单独绑定
[wm:C]
h = C-A-M-h
j = C-A-M-j
k = C-A-M-k
l = C-A-M-l
1 = C-A-M-1
2 = C-A-M-2
3 = C-A-M-3
4 = C-A-M-4
5 = C-A-M-5
6 = C-A-M-6
7 = C-A-M-7
8 = C-A-M-8
9 = C-A-M-9
comma = C-A-M-comma
dot = C-A-M-dot
apostrophe = C-A-M-apostrophe
semicolon = C-A-M-semicolon
m = C-A-M-m
leftbrace = C-A-M-leftbrace
rightbrace = C-A-M-rightbrace
grave = C-A-M-grave
enter = C-A-M-enter
slash = C-A-M-slash
esc = C-A-M-esc

# fn 层：与 macOS 习惯一致
[fn]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
up = pageup
down = pagedown
left = home
right = end
backspace = delete
