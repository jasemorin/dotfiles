# nobara 分支：KDE / niri（DankMaterialShell）+ Razer Huntsman V3 Pro Mini
# caps lock：单击 = esc；按住 = ctrl，但下面列出的键改发 ctrl+alt+super+键，只给 niri 用
# （思路同 asahi 分支；Asahi 的 fn 层这里用不上）
# 系统级配置，不走 install.sh：
#   sudo cp ~/dotfiles/system/keyd/default.conf /etc/keyd/ && sudo systemctl restart keyd   # 不要用 keyd reload，可能崩溃
# 在内核输入层生效，KDE（Wayland / X11）、niri 和 TTY 都适用
# 物理 Control 键不受影响，始终是普通 ctrl
[ids]
*

[main]
capslock = overload(wm, esc)

# 按住 caps 时默认就是 ctrl（Caps+C / Caps+R / Caps+W 等照常）
# 下面的键例外：改发 ctrl+alt+super+键，没有应用会用到这个组合；KDE 下它们什么都不做
# 同时按住 shift 会原样带上，所以 Caps+Shift+键 也能单独绑定（见 system/niri/local.kdl）
[wm:C]
h = C-A-M-h
j = C-A-M-j
k = C-A-M-k
l = C-A-M-l
left = C-A-M-left
down = C-A-M-down
up = C-A-M-up
right = C-A-M-right
1 = C-A-M-1
2 = C-A-M-2
3 = C-A-M-3
4 = C-A-M-4
5 = C-A-M-5
6 = C-A-M-6
7 = C-A-M-7
8 = C-A-M-8
9 = C-A-M-9
u = C-A-M-u
i = C-A-M-i
o = C-A-M-o
tab = C-A-M-tab
