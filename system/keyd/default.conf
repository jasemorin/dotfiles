# nobara 分支：KDE + Razer Huntsman V3 Pro Mini（Asahi 版的 niri 窗口层、fn 层这里用不上，见 asahi 分支）
# caps lock：单击 = esc；按住 = ctrl
# 系统级配置，不走 install.sh：
#   sudo cp ~/dotfiles/system/keyd/default.conf /etc/keyd/ && sudo systemctl restart keyd   # 不要用 keyd reload，可能崩溃
# 在内核输入层生效，KDE（Wayland / X11）和 TTY 都适用
# 物理 Control 键不受影响，始终是普通 ctrl
[ids]
*

[main]
capslock = overload(control, esc)
