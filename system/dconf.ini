# 桌面设置（dconf），已去掉窗口状态、定位坐标等机器专属项
# 恢复：dconf load / < ~/dotfiles/system/dconf.ini

[com/github/libpinyin/ibus-libpinyin/libpinyin]
dictionaries='5;12;15'
display-style=0
double-pinyin=true
double-pinyin-schema=5

[org/erikreider/swaync]
dnd-state=false

[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///home/jcao/.config/background'
picture-uri-dark='file:///home/jcao/.config/background'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/input-sources]
current=uint32 0
mru-sources=[('xkb', 'us')]
sources=[('xkb', 'us'), ('ibus', 'libpinyin')]
xkb-options=['terminate:ctrl_alt_bksp']

[org/gnome/desktop/interface]
accent-color='pink'
color-scheme='default'
gtk-im-module=''
show-battery-percentage=false

[org/gnome/desktop/peripherals/keyboard]
delay=uint32 250
repeat-interval=uint32 20

[org/gnome/desktop/peripherals/touchpad]
edge-scrolling-enabled=false
two-finger-scrolling-enabled=true

[org/gnome/desktop/privacy]
report-technical-problems=true

[org/gnome/desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[org/gnome/desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/fedora-workstation/montclair_light.webp'
primary-color='#000000000000'
secondary-color='#000000000000'

[org/gnome/desktop/wm/keybindings]
activate-window-menu=@as []
switch-input-source=['<Alt>space']
switch-input-source-backward=['<Shift><Alt>space']

[org/gnome/shell]

[org/gnome/system/location]
enabled=true

[system/locale]
region='en_AU.UTF-8'
