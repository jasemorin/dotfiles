# zswap 改用 zstd 压缩（Asahi 默认 lzo）：同样的内存能多装约三成
# 系统级，不走 install.sh：
#   sudo cp ~/dotfiles/system/zswap/zswap-zstd.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/zswap-zstd.conf
# 用运行时写 sysfs 而不是内核参数：zstd 在这个内核里是模块，写进启动参数
# 可能在模块加载前生效失败、悄悄回退到 lzo；写 sysfs 会自动加载模块，不用重启
w /sys/module/zswap/parameters/compressor - - - - zstd
