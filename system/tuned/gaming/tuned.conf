# 游戏用电源模式：继承 throughput-performance（CPU 高频等），但保留 swappiness 60
# throughput-performance 把 swappiness 设成 10，在 8 GB + zswap 上内存紧时更容易卡、Steam 更容易闪退
# 部署：sudo cp -r ~/dotfiles/system/tuned/gaming /etc/tuned/profiles/
# 切换：sudo tuned-adm profile gaming；玩完切回 sudo tuned-adm profile balanced
[main]
summary=throughput-performance, keeping swappiness 60 for 8 GB + zswap
include=throughput-performance

[sysctl]
vm.swappiness=60
