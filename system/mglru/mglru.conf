# 内存快耗尽时防止整机卡死（ChromeOS 在小内存机器上的做法）
# enabled=y：完整启用 MGLRU（默认只开了基础部分 0x0001）
# min_ttl_ms=1000：最近 1 秒内用过的页面不回收；实在不够时由 OOM 机制结束占用最多的进程，
#                  而不是反复换进换出、整机卡住好几秒
# 系统级，不走 install.sh：
#   sudo cp ~/dotfiles/system/mglru/mglru.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/mglru.conf
w /sys/kernel/mm/lru_gen/enabled - - - - y
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
