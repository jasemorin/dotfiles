# 启用内核的新内存回收机制 MGLRU
# enabled=y：启用内核支持的全部 MGLRU 功能（这台 ARM 机器上只支持基础部分，结果仍是 0x0001）
# min_ttl_ms=0：关闭「1 秒防卡死」。原来是 1000（ChromeOS 的做法：最近 1 秒用过的页面留不住就直接 OOM），
#   但它不看交换空间：2026-09-25 玩 Big Walk 时交换还剩 13 GB，加载阶段两次被 kswapd0 触发 OOM，
#   整个 Steam 虚拟机被结束。没有磁盘交换的机器（ChromeOS）适合 1000；这里有 16 GB 交换 + systemd-oomd，
#   防卡死交给 oomd（内存压力持续一段时间才动手）
# 系统级，不走 install.sh：
#   sudo cp ~/dotfiles/system/mglru/mglru.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/mglru.conf
w /sys/kernel/mm/lru_gen/enabled - - - - y
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 0
