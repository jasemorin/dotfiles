# 启动器（cmd+space）：Catppuccin Mocha 紫色配色，和 kitty、niri 焦点框一致；圆角 22 和 Quickshell 面板一样
[main]
# 图标字体兜底给提示符的放大镜
font=Adwaita Sans:size=13,Symbols Nerd Font:size=13
terminal=kitty
prompt="󰍉  "
placeholder=搜索应用
match-counter=yes
icons-enabled=yes
width=38
lines=8
horizontal-pad=12
vertical-pad=12
inner-pad=6
# 行高也决定图标大小（fuzzel 按行高缩放图标）
line-height=30
image-size-ratio=0.4

[colors]
# Catppuccin Mocha。底色 base 几乎不透明：壁纸是橙色的，透得多了整块会发棕，紫色就没了
background=1e1e2ef2
text=cdd6f4ff
prompt=b4befeff
# overlay1
placeholder=7f849cff
input=cdd6f4ff
# 匹配的字母用 mauve，描边和提示符用 lavender（和 niri 焦点框同色）
match=cba6f7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=b4befeff

[border]
width=1
# 和 niri 里 namespace="^launcher$" 的 geometry-corner-radius 保持一致
radius=22
selection-radius=10
