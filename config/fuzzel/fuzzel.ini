# 启动器（cmd+space）：和 Quickshell 面板同一套外观——半透明深底 + niri 模糊、白色细描边、22 圆角、#b4befe 强调色
[main]
# 图标字体兜底给提示符的放大镜
font=Adwaita Sans:size=14,Symbols Nerd Font:size=14
terminal=kitty
prompt="󰍉   "
placeholder=搜索应用
match-counter=yes
icons-enabled=yes
width=44
lines=8
horizontal-pad=18
vertical-pad=18
inner-pad=12
line-height=38
image-size-ratio=0.4

[colors]
# 底色 = 面板的 rgba(0.08, 0.08, 0.1, 0.6)；透明度别调高，不然 niri 的模糊透不出来
background=14141a99
text=ffffffd9
prompt=b4befeff
placeholder=ffffff66
input=ffffffff
match=b4befeff
# 选中行 = 快捷设置磁贴的白色 10% 底
selection=ffffff1f
selection-text=ffffffff
selection-match=b4befeff
counter=ffffff59
# 描边 = 面板的 rgba(1, 1, 1, 0.08)
border=ffffff14

[border]
width=1
# 和 niri 里 namespace="^launcher$" 的 geometry-corner-radius 保持一致
radius=22
selection-radius=12
