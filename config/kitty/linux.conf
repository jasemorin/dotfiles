# ── 仅 Linux 加载（kitty.conf 末尾 include ${KITTY_OS}.conf）──
# nobara 分支：KDE 桌面，没有 niri 管分屏，所以分屏回到 kitty 里
# cmd 在 Linux 上是 Super，KDE 会抢走 super+d/l/1-9 等，这里一律用 kitty_mod（ctrl+shift）
# kitty 的 ctrl+shift 默认键位（ctrl+shift+t/w/c/v 等）照常可用

# splits 必须排第一，否则 --location=vsplit/hsplit 不生效
enabled_layouts splits,stack
map kitty_mod+enter     launch --cwd=current --location=vsplit
map kitty_mod+alt+enter launch --cwd=current --location=hsplit
map kitty_mod+z         toggle_layout stack
map kitty_mod+r         layout_action rotate

# 分屏间移动（覆盖默认的 ctrl+shift+h 看回滚、ctrl+shift+l 换布局、j/k 滚动一行）
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right
map kitty_mod+alt+h resize_window narrower 2
map kitty_mod+alt+j resize_window shorter 2
map kitty_mod+alt+k resize_window taller 2
map kitty_mod+alt+l resize_window wider 2

# ── 外观（屏幕缩放 1.67 倍，这台 Nobara 是 1.7；Mac 上的数值在这里偏大）──
font_size 13.0
background_opacity 0.80
# 上下 12，左右 16
window_padding_width 12 16
tab_bar_edge top

# 标签栏：圆角胶囊，当前标签用 lavender（与 niri 的焦点边框同色）；
# 背景透明，跟窗口一起毛玻璃，不再是一条深色横带
tab_powerline_style round
tab_bar_margin_width 8
tab_bar_margin_height 6 6
tab_bar_background none
inactive_tab_background #313244
active_tab_background #B4BEFE
active_tab_font_style bold
tab_title_template "{index} {title[title.rfind('/')+1:]}"

# 列出所有标签页，按键选择（ctrl+shift+t 仍是新建标签页）
map kitty_mod+alt+t select_tab
