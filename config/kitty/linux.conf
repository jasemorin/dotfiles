# ── 仅 Linux 加载（kitty.conf 末尾 include ${KITTY_OS}.conf）──
# 分屏交给 niri：每个 kitty 窗口就是一个 niri 窗口，caps+hjkl 统一切换
# 标签页（cmd+t / cmd+w / cmd+1-5）仍在 kitty.conf 里

enabled_layouts stack

# ── 外观（屏幕缩放 1.67 倍，Mac 上的数值在这里偏大）──
font_size 13.0
background_opacity 0.80
# 上下 12，左右 16
window_padding_width 12 16
tab_bar_edge top

# 标签栏：圆角胶囊，当前标签用 lavender（与 niri 的焦点边框同色）；
# 背景透明，跟窗口一起毛玻璃，不再是一条深色横带
tab_powerline_style round
tab_bar_margin_width 8
tab_bar_margin_height 6 6
tab_bar_background none
inactive_tab_background #313244
active_tab_background #B4BEFE
active_tab_font_style bold
tab_title_template "{index} {title[title.rfind('/')+1:]}"

# cmd+k 清屏（同 macOS 终端）；物理 control+l 也照常清屏
map cmd+k clear_terminal to_cursor active

# 列出所有标签页，按键选择（Mac 上这个键是 detach_window，见 macos.conf）
map cmd+shift+t select_tab
