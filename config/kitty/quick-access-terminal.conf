# ── 下拉终端（kitten quick-access-terminal）──────
# Mac 和 Linux 共用（这个文件不能按系统 include），只放两边都适用的设置
# 这个文件只接受 quick-access-terminal 自己的选项；
# kitty 的选项要写成 kitty_override name=value，其余继承 kitty.conf
# Linux 上由 niri 的 caps+shift+enter 呼出，再按一次收起

edge top
lines 20
# hide_on_focus_loss 在 niri 下会让再次呼出无法收起（kitty 0.47），先不用
background_opacity 0.85

# 字号不单独设：继承各系统主窗口的字号（Linux 在 linux.conf，Mac 在 kitty.conf）

# 必须：kitty.conf 的 hide_window_decorations titlebar-only 在下拉终端（layer-shell 窗口，没有标题栏）上
# 会让 kitty 0.47 崩溃（glfwWaylandSetTitlebarHidden 空指针），这里关掉
kitty_override hide_window_decorations=no
