# ──────────────────────────────────────────────
#  Kitty Terminal Configuration
#  Theme: Catppuccin Mocha (dark)
# ──────────────────────────────────────────────

# ── Font ──────────────────────────────────────
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

# Adjust line height and cell width for readability
adjust_line_height 110%
adjust_column_width 0

# ── Cursor ────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback ────────────────────────────────
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ─────────────────────────────────────
copy_on_select clipboard
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes

# ── Bell ──────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab "🔔 "

# ── Window ────────────────────────────────────
remember_window_size  yes
initial_window_width  120c
initial_window_height 35c
window_padding_width  8
hide_window_decorations titlebar-only
confirm_os_window_close 0
background_opacity 0.70
dynamic_background_opacity yes
background_blur 64

# ── Layouts ───────────────────────────────────
# splits 必须排第一，否则 --location=vsplit/hsplit 不生效
enabled_layouts splits,stack,tall,fat,grid

# ── Tab Bar ───────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}: {title[title.rfind('/')+1:]}"

# ── macOS Specific ────────────────────────────
macos_titlebar_color background
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_thicken_font 0.25

# ── Performance ───────────────────────────────
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ── Shell Integration ─────────────────────────
shell_integration enabled

# ── Keybindings ───────────────────────────────

# Tabs
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+1       goto_tab 1
map cmd+2       goto_tab 2
map cmd+3       goto_tab 3
map cmd+4       goto_tab 4
map cmd+5       goto_tab 5
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# Windows (splits)
map cmd+d       launch --cwd=current --location=vsplit
map cmd+shift+d launch --cwd=current --location=hsplit
map cmd+shift+enter toggle_layout stack

# Navigate between splits
map cmd+left    neighboring_window left
map cmd+right   neighboring_window right
map cmd+up      neighboring_window up
map cmd+down    neighboring_window down

# Resize splits
map cmd+shift+left  resize_window narrower 2
map cmd+shift+right resize_window wider 2
map cmd+shift+up    resize_window taller 2
map cmd+shift+down  resize_window shorter 2

# Scrollback
map cmd+k       clear_terminal scrollback active
map cmd+shift+k scroll_home
map cmd+shift+j scroll_end

# Font size
map cmd+equal   change_font_size all +1.0
map cmd+minus   change_font_size all -1.0
map cmd+0       change_font_size all 0

# Misc
map cmd+shift+, load_config_file
map cmd+f       launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/less +G -R

# Hints (keyboard-driven selection)
map ctrl+shift+p kitten hints
map ctrl+shift+o kitten hints --type path

# ── Theme (Catppuccin Mocha) ──────────────────
include current-theme.conf
