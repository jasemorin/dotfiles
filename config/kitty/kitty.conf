# ──────────────────────────────────────────────
#  Kitty Terminal Configuration
#  Theme: Catppuccin Mocha (dark)
# ──────────────────────────────────────────────

# ── Font ──────────────────────────────────────
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

# Adjust line height and cell width for readability
adjust_line_height 110%
adjust_column_width 0

# ── Cursor ────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback ────────────────────────────────
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ─────────────────────────────────────
copy_on_select clipboard
mouse_hide_wait 3.0
url_style curly
open_url_with default
detect_urls yes

# ── Bell ──────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab "🔔 "

# ── Window ────────────────────────────────────
remember_window_size  yes
initial_window_width  120c
initial_window_height 35c
window_padding_width  8
hide_window_decorations titlebar-only
confirm_os_window_close 0
background_opacity 0.70
dynamic_background_opacity yes
background_blur 64

# ── Layouts ───────────────────────────────────
# splits 必须排第一，否则 --location=vsplit/hsplit 不生效
enabled_layouts splits,stack,tall,fat,grid

# ── Tab Bar ───────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}: {title[title.rfind('/')+1:]}"

# ── macOS Specific ────────────────────────────
macos_titlebar_color background
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_thicken_font 0.25

# ── Performance ───────────────────────────────
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ── Shell Integration ─────────────────────────
shell_integration enabled

# ── Keybindings ───────────────────────────────

# Tabs
map cmd+t       new_tab_with_cwd
map cmd+w       close_tab
map cmd+1       goto_tab 1
map cmd+2       goto_tab 2
map cmd+3       goto_tab 3
map cmd+4       goto_tab 4
map cmd+5       goto_tab 5
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# Windows (splits)
map cmd+d       launch --cwd=current --location=vsplit
map cmd+shift+d launch --cwd=current --location=hsplit
map cmd+shift+enter toggle_layout stack

# Navigate between splits
map cmd+left    neighboring_window left
map cmd+right   neighboring_window right
map cmd+up      neighboring_window up
map cmd+down    neighboring_window down

# Resize splits
map cmd+shift+left  resize_window narrower 2
map cmd+shift+right resize_window wider 2
map cmd+shift+up    resize_window taller 2
map cmd+shift+down  resize_window shorter 2

# Scrollback
map cmd+k       clear_terminal scrollback active
map cmd+shift+k scroll_home
map cmd+shift+j scroll_end

# Font size
map cmd+equal   change_font_size all +1.0
map cmd+minus   change_font_size all -1.0
map cmd+0       change_font_size all 0

# Misc
map cmd+shift+, load_config_file
map cmd+f       launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/less +G -R

# Hints (keyboard-driven selection)
map ctrl+shift+p kitten hints
map ctrl+shift+o kitten hints --type path

# ── 全键盘操作 ────────────────────────────────
# 目标：不碰鼠标也能完成分屏、跳转、选择、复制、翻阅输出。

# --- 分屏：关闭与循环 ---
map cmd+shift+w close_window
map cmd+]       next_window
map cmd+[       previous_window

# --- 分屏：可视化跳转（按下后每个分屏显示字母，按字母直达）---
map cmd+shift+; focus_visible_window
map cmd+shift+' swap_with_window

# --- 分屏：移动位置（改变布局结构，不是移动焦点）---
map cmd+ctrl+left  move_window left
map cmd+ctrl+right move_window right
map cmd+ctrl+up    move_window up
map cmd+ctrl+down  move_window down

# --- 分屏：拆出为独立 tab ---
map cmd+shift+t detach_window new-tab

# --- 布局切换 ---
map cmd+shift+l next_layout
map cmd+shift+e layout_action bias 50

# --- 命令历史导航（依赖 shell integration，你已开启）---
map alt+up    scroll_to_prompt -1
map alt+down  scroll_to_prompt 1
map alt+enter show_last_command_output

# --- 不用鼠标选中并复制 ---
map cmd+shift+space kitten hints --type word --program @
map cmd+shift+y     kitten hints --type line --program @
map cmd+shift+g     kitten hints --type hyperlink

# --- tab 可视化跳转 ---
map cmd+shift+p select_tab
map cmd+shift+n set_tab_title

# --- 特殊字符输入 ---
map cmd+shift+u kitten unicode_input

# --- cmd+shift+w 被上面改成关闭分屏，原本的"关整个系统窗口"挪到这里 ---
map cmd+alt+w close_os_window

# ── Vim 风格窗口模式 ──────────────────────────
# ctrl+w 进入，随后单键执行，执行完自动退出（等同 vim 的 ctrl+w 前缀）
# 未绑定的键直接退出模式，不会卡住。Esc 手动退出。
#
# 注意：ctrl+w 被接管后 shell 的"删除前一个词"失效，改用 alt+backspace。

map --new-mode win --on-action end --on-unknown end ctrl+w

# 移动焦点（vim: ctrl+w h/j/k/l）
map --mode win h neighboring_window left
map --mode win j neighboring_window down
map --mode win k neighboring_window up
map --mode win l neighboring_window right

# 循环切换（vim: ctrl+w w / ctrl+w p）
map --mode win w      next_window
map --mode win ctrl+w next_window
map --mode win p      previous_window

# 搬移窗口位置（vim: ctrl+w H/J/K/L）
map --mode win shift+h move_window left
map --mode win shift+j move_window down
map --mode win shift+k move_window up
map --mode win shift+l move_window right

# 切分（vim: ctrl+w s 上下分，ctrl+w v 左右分）
map --mode win s launch --cwd=current --location=hsplit
map --mode win v launch --cwd=current --location=vsplit
map --mode win n launch --cwd=current

# 关闭与最大化（vim: ctrl+w q / ctrl+w o）
map --mode win q close_window
map --mode win c close_window
map --mode win o toggle_layout stack

# 交换与均分（vim: ctrl+w x / ctrl+w =）
map --mode win x swap_with_window
map --mode win equal layout_action bias 50

# 跳转与重排
map --mode win f focus_visible_window
map --mode win 1 nth_window 0
map --mode win 2 nth_window 1
map --mode win 3 nth_window 2
map --mode win 4 nth_window 3
map --mode win 5 nth_window 4

# tab（vim 的 ctrl+w T = 拆到新标签页）
map --mode win shift+t detach_window new-tab
map --mode win t       new_tab_with_cwd

# 进入调整模式 / 退出
map --mode win r push_keyboard_mode resize
map --mode win esc pop_keyboard_mode

# ── 调整大小模式 ──────────────────────────────
# hjkl 连续调整，不自动退出；Esc 或 q 退出。
map --new-mode resize --on-action keep --on-unknown end cmd+shift+r

map --mode resize h resize_window narrower 2
map --mode resize l resize_window wider 2
map --mode resize k resize_window taller 2
map --mode resize j resize_window shorter 2
map --mode resize equal layout_action bias 50
map --mode resize esc pop_keyboard_mode
map --mode resize q   pop_keyboard_mode
map --mode resize enter pop_keyboard_mode

# ── Theme (Catppuccin Mocha) ──────────────────
include current-theme.conf
