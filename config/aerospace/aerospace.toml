# AeroSpace 配置
# 修饰键统一用 Hyper = cmd-ctrl-alt-shift（Karabiner 把「按住右 Cmd」映射成它）
# 改完这个文件后跑:  aerospace reload-config   （或按 Hyper-0）

after-login-command = []
after-startup-command = []
start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# 窗口之间和屏幕边缘的留白
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.right      = 8
outer.top        = 8
outer.bottom     = 8

[mode.main.binding]

# ---- 移动焦点：hjkl，和 Vim 同方向 ----
cmd-ctrl-alt-shift-h = 'focus left'
cmd-ctrl-alt-shift-j = 'focus down'
cmd-ctrl-alt-shift-k = 'focus up'
cmd-ctrl-alt-shift-l = 'focus right'

# ---- 搬动窗口：yuio，就在 hjkl 正上方一排 ----
cmd-ctrl-alt-shift-y = 'move left'
cmd-ctrl-alt-shift-u = 'move down'
cmd-ctrl-alt-shift-i = 'move up'
cmd-ctrl-alt-shift-o = 'move right'

# ---- 切工作区：用首字母，不用数字 ----
# 工作区名字就是这个字母本身，按任务分而不是按窗口分
cmd-ctrl-alt-shift-b = 'workspace B'   # Browser  浏览器 / 查资料
cmd-ctrl-alt-shift-c = 'workspace C'   # Code     kitty + Neovim
cmd-ctrl-alt-shift-n = 'workspace N'   # Notes    Obsidian
cmd-ctrl-alt-shift-m = 'workspace M'   # Message  微信 / 邮件
cmd-ctrl-alt-shift-x = 'workspace X'   # eXtra    临时 / 杂项

# ---- 把当前窗口丢到某个工作区：Hyper-P 进 move 模式，再按目标字母 ----
# （Hyper 里已经含 Shift，所以做不出 "Hyper+Shift+B"，只能走模式）
cmd-ctrl-alt-shift-p = 'mode move'

# 在最近两个工作区之间来回跳 —— 实际用得比编号还多
cmd-ctrl-alt-shift-tab = 'workspace-back-and-forth'

# ---- 布局 ----
cmd-ctrl-alt-shift-f     = 'fullscreen'
cmd-ctrl-alt-shift-slash = 'layout tiles horizontal vertical'      # 横排 <-> 竖排
cmd-ctrl-alt-shift-comma = 'layout accordion horizontal vertical'  # 手风琴（窗口多时）
cmd-ctrl-alt-shift-0     = 'reload-config'

# ---- 调大小：进 resize 模式后直接按 hjkl 连按，Esc 退出 ----
cmd-ctrl-alt-shift-semicolon = 'mode resize'

# =====================================================================
# Option 版：和上面的 Hyper 版并存，两套都能用
# Option 不含 Shift，所以「搬窗口」「丢到工作区」可以直接 Option+Shift，不用进模式
# =====================================================================

# 焦点 / 搬窗口
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# 切工作区
alt-b = 'workspace B'
alt-c = 'workspace C'
alt-n = 'workspace N'
alt-m = 'workspace M'
alt-x = 'workspace X'

# 把窗口直接丢过去（一步到位）
alt-shift-b = 'move-node-to-workspace B --focus-follows-window'
alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
alt-shift-n = 'move-node-to-workspace N --focus-follows-window'
alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
alt-shift-x = 'move-node-to-workspace X --focus-follows-window'

alt-tab = 'workspace-back-and-forth'

[mode.move.binding]
b = ['move-node-to-workspace B --focus-follows-window', 'mode main']
c = ['move-node-to-workspace C --focus-follows-window', 'mode main']
n = ['move-node-to-workspace N --focus-follows-window', 'mode main']
m = ['move-node-to-workspace M --focus-follows-window', 'mode main']
x = ['move-node-to-workspace X --focus-follows-window', 'mode main']
esc = 'mode main'
enter = 'mode main'
cmd-ctrl-alt-shift-p = 'mode main'   # 再按一次进入键也能退出

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'
enter = 'mode main'
cmd-ctrl-alt-shift-semicolon = 'mode main'   # 再按一次进入键也能退出

# ---- 不参与平铺的窗口（强行平铺系统设置这类弹窗会很难受）----
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'
